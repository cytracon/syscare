<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2740"/>
      <stop offset="100%" stop-color="#0c121c"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ec8ff"/>
      <stop offset="55%" stop-color="#3d8bfd"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <!-- app background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- outer gauge ring -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#1e2a3d" stroke-width="28"/>
  <path d="M256 108 A148 148 0 1 1 148 360" fill="none" stroke="url(#ring)" stroke-width="28" stroke-linecap="round"/>
  <!-- inner dial -->
  <circle cx="256" cy="256" r="96" fill="#101826" stroke="#2a3a52" stroke-width="8"/>
  <!-- heart / care mark -->
  <path d="M256 300c-28-24-72-52-72-92 0-24 18-40 40-40 14 0 26 8 32 20 6-12 18-20 32-20 22 0 40 16 40 40 0 40-44 68-72 92z" fill="url(#leaf)"/>
  <!-- pulse spark -->
  <circle cx="340" cy="170" r="14" fill="#5ec8ff" opacity="0.9"/>
  <!-- small bars (resources) -->
  <g fill="#8ab4f8" opacity="0.75">
    <rect x="118" y="360" width="18" height="42" rx="4"/>
    <rect x="146" y="340" width="18" height="62" rx="4"/>
    <rect x="174" y="352" width="18" height="50" rx="4"/>
  </g>
</svg>
